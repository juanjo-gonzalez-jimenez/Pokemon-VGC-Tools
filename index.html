<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VGC Tools</title>
    <meta name="description" content="Pokémon Champions VGC tools: type coverage, team analysis and a Pokémon usage searcher, built on Smogon usage stats." />
    <!-- The ?v= number changes with the icon, so browsers fetch it again instead of showing a saved copy. -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg?v=2" />
    <script>
      // Apply the saved theme before first paint to avoid a light flash.
      try {
        const theme = localStorage.getItem('vgc-tools:theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
